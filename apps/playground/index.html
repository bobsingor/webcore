<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webcore playground</title>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span class="name">webcore</span>
        <span class="tag">M0 kernel spike</span>
      </div>
      <div id="status" class="status" data-state="booting">booting kernel…</div>
    </header>

    <main class="layout">
      <section class="terminal" aria-label="Terminal">
        <div id="output" class="output" role="log" aria-live="polite"></div>
        <form id="prompt" class="prompt">
          <label id="ps1" class="ps1" for="input"></label>
          <input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" disabled />
        </form>
      </section>

      <aside class="side">
        <section>
          <h2>Try</h2>
          <div id="examples" class="examples"></div>
        </section>
        <section class="events-panel">
          <h2>Kernel events <span id="event-count" class="count"></span></h2>
          <ol id="events" class="events"></ol>
        </section>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
